<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="MyVault - Secure Personal Document Vault"
    >

    <meta
        name="theme-color"
        content="#030b18"
    >

    <title>MyVault — Secure Document Vault</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         BACKGROUND DECORATION
         ===================================================== -->

    <div class="background-decoration" aria-hidden="true">

        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

    </div>


    <!-- =====================================================
         MAIN APPLICATION
         ===================================================== -->

    <main class="container">

        <!-- =================================================
             BRAND
             ================================================= -->

        <header class="brand-section">

            <div class="vault-logo" aria-hidden="true">
                🔐
            </div>

            <h1>MyVault</h1>

            <p class="subtitle">
                Your Secure Personal Document Vault
            </p>

            <p class="tagline">
                Store • Protect • Search • Manage
            </p>

        </header>


        <!-- =================================================
             APPLICATION CONTENT
             ================================================= -->

        <section id="content">

            <!-- =================================================
                 DEFAULT WELCOME CARD
                 ================================================= -->

            <div class="welcome-card">

                <div class="welcome-icon" aria-hidden="true">
                    🛡️
                </div>

                <h2>
                    Welcome to MyVault
                </h2>

                <p>
                    Securely store, manage and search your
                    important personal documents in one place.
                </p>

                <div class="buttons">

                    <button
                        type="button"
                        class="btn-primary"
                        onclick="showLogin()"
                    >
                        🔑 Login
                    </button>

                    <button
                        type="button"
                        class="btn-secondary"
                        onclick="showRegister()"
                    >
                        📝 Create Account
                    </button>

                </div>

            </div>

        </section>


        <!-- =================================================
             FOOTER
             ================================================= -->

        <footer class="app-footer">

            <p>
                🔒 MyVault — Secure Personal Document Storage
            </p>

            <span>
                Your documents. Your privacy. Your control.
            </span>

        </footer>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="script.js"></script>

</body>

</html>
